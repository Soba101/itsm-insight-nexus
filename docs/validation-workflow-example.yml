name: Validation and Security Checks

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      
    - name: Run TypeScript type check
      run: npx tsc --noEmit
      
    - name: Build
      run: npm run build
      
    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

  backend-auth-validation:
    name: Backend Auth Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend-auth/package-lock.json
        
    - name: Install dependencies
      working-directory: backend-auth
      run: npm ci
      
    - name: Check JavaScript syntax
      working-directory: backend-auth
      run: |
        node --check server.js
        node --check validation.js
        node --check run-migration.js
      
    - name: Run npm audit
      working-directory: backend-auth
      run: npm audit --audit-level=moderate
      continue-on-error: true

  backend-python-validation:
    name: Backend Python Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      working-directory: backend-python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Check Python syntax
      working-directory: backend-python
      run: |
        python -m py_compile app/main.py
        python -m py_compile app/core/validation.py
        python -m py_compile app/core/error_handlers.py
        python -m py_compile app/core/auth.py
        python -m py_compile app/core/config.py
        python -m py_compile app/core/database.py
        
    - name: Run Python linter (flake8)
      working-directory: backend-python
      run: |
        pip install flake8
        flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true
      
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true
